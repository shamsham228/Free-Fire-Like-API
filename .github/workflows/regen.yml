name: Regenerate Tokens

on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Regenerate tokens
        run: python regenerate_tokens.py

      - name: Check changes
        id: check
        run: |
          if git diff --quiet tokens.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.check.outputs.changed == 'true'
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add tokens.json
          git commit -m "🔄 Auto-update tokens - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin main

      - name: Trigger Vercel Deploy
        if: steps.check.outputs.changed == 'true'
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
          echo "✅ Vercel deployment triggered"

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.changed }}" == "true" ]; then
            echo "✅ Tokens updated and Vercel deployed"
          else
            echo "ℹ️ No token changes needed"
          fi
